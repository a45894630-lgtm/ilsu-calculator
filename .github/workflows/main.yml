name: 일수계산기 APK 만들기

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 파일 가져오기
        uses: actions/checkout@v4

      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: Android SDK 설치
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 프로젝트 압축 풀기
        run: |
          mkdir -p projectfiles
          unzip -q ./*.zip -d projectfiles

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: APK 빌드
        run: |
          PROJECT_DIR=$(find projectfiles -name settings.gradle.kts -print -quit | xargs dirname)
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: APK 저장
        uses: actions/upload-artifact@v4
        with:
          name: 일수계산기-APK
          path: projectfiles/**/app/build/outputs/apk/debug/app-debug.apk
